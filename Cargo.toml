[package]
name = "cryptr"
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Sebastian Dobe <sebastiandobe@mailbox.org"]
categories = ["command-line-utilities", "cryptography", "data-structures"]
keywords = ["cli", "cryptography", "encryption", "utility", "security"]
description = "simple encrypted (streaming) values"
readme = "README.md"
repository = "https://github.com/sebadob/cryptr"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
cli = ["s3", "streaming", "dep:clap", "dep:colored", "dep:home", "dep:rpassword"]
s3 = ["streaming", "dep:reqwest", "dep:s3-simple", "dep:tokio-util"]
streaming = ["dep:aead-stream", "dep:reqwest"]

[patch.crates-io]
#s3-simple = { path = "../s3-simple" }

[dependencies]
async-stream = "0.3.5"
async-trait = "0.1.74"
base64 = "0.23"
bincode = "2"
bytes = "1.11.1"
dotenvy = "0.15.7"
flume = "0.12"
futures = "0.3.29"
thiserror = "2"
tokio = { version = "1.35.0", features = ["fs", "io-std", "macros", "rt-multi-thread"] }
tracing = { version = "0.1.40", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing"] }
rand = { version = "0.10", features = [] }
regex = "1.10.2"

# cli
clap = { version = "4.4.10", optional = true, features = ["derive"] }
colored = { version = "3", optional = true }
home = { version = "0.5.5", optional = true }
rpassword = { version = "7.3.1", optional = true }

# s3
reqwest = { version = "0.13.4", optional = true, default-features = false, features = [
    "json", "rustls", "stream"
] }
s3-simple = { version = "0.9", optional = true }
tokio-util = { version = "0.7.10", optional = true, features = ["io"] }

# streaming
aead-stream = { version = "0.6", optional = true, features = ["alloc"] }

# std
argon2 = { version = "0.5.2", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["rand_core", "zeroize"] }

# fix minimal versions
# sharded-slab
lazy_static = "1.1.0"

[dev-dependencies]
cryptr = { path = ".", features = ["cli"] }
rstest = "0.26"
tokio-test = "0.4.3"
